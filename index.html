
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swatu Mock Test for School Students</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#1d4ed8;color:white;text-align:center;padding:25px 12px}
header h1{margin:0 0 8px}
main{max-width:800px;margin:25px auto;padding:0 14px}
.card{background:white;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #0000000b}
h2{margin-top:0}
label{display:block;font-weight:bold;margin:12px 0 6px}
select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:white}
button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;margin:5px 4px 0 0}
.primary{background:#2563eb;color:white}
.secondary{background:#e2e8f0;color:#172033}
.option{display:flex;gap:10px;padding:13px;border:1px solid #cbd5e1;border-radius:9px;margin:10px 0;cursor:pointer}
.option:has(input:checked){background:#eff6ff;border-color:#2563eb}
.hidden{display:none!important}
.bar{height:7px;background:#e2e8f0;border-radius:10px;margin:15px 0;overflow:hidden}
#progress{height:100%;width:0;background:#2563eb}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#64748b}
.score{font-size:38px;font-weight:bold;color:#2563eb}
.stat{display:inline-block;background:#f1f5f9;border-radius:8px;padding:14px;margin:4px;text-align:center}
.review{border-top:1px solid #e2e8f0;padding:12px 0}
.correct{color:#15803d}.wrong{color:#b91c1c}
footer{text-align:center;color:#64748b;padding:20px}
@media(max-width:480px){.card{padding:16px}.score{font-size:32px}}
</style>
</head>
<body>
<header>
<h1>Swatu Mock Test</h1>
<p>Smart Practice for School Students | Classes 6–12</p>
</header>
<main>
<section class="card" id="setup">
<h2>Start Your Mock Test</h2>
<label for="classSelect">Select Class</label>
<select id="classSelect">
<option value="6">Class 6</option><option value="7">Class 7</option>
<option value="8">Class 8</option><option value="9">Class 9</option>
<option value="10">Class 10</option><option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>
<label for="subjectSelect">Select Subject</label>
<select id="subjectSelect">
<option>Science</option><option>Mathematics</option>
<option>English</option><option>Social Science</option>
</select>
<p id="level">Difficulty: Easy</p>
<button class="primary" id="start">Start Test</button>
</section>

<section class="card hidden" id="test">
<div class="meta"><span id="testName"></span><span id="count"></span><span id="timer">00:00</span></div>
<div class="bar"><div id="progress"></div></div>
<h3 id="question"></h3>
<div id="options"></div>
<button class="secondary" id="prev">Previous</button>
<button class="primary" id="next">Next Question</button>
<button class="primary hidden" id="submit">Submit Test</button>
<button class="secondary" id="exit">Exit</button>
</section>

<section class="card hidden" id="result">
<h2>Test Result</h2>
<p id="resultName"></p>
<div class="score" id="score"></div>
<p id="message"></p>
<div class="stat">Correct<br><strong id="correct"></strong></div>
<div class="stat">Incorrect<br><strong id="incorrect"></strong></div>
<div class="stat">Percentage<br><strong id="percent"></strong></div>
<h3>Answer Review</h3>
<div id="review"></div>
<button class="primary" id="retry">Try Again</button>
<button class="secondary" id="change">Choose Another Test</button>
</section>
</main>
<footer>© <span id="year"></span> Swatu Mock Test</footer>

// Keep five questions for every class and subject.
let questions=[], answers=[], current=0, startedAt=0, timerHandle=null, elapsed=0;
const $=id=>document.getElementById(id);
$("year").textContent=new Date().getFullYear();

function updateLevel(){
  const c=Number($("classSelect").value);
  $("level").textContent="Difficulty: "+(c<=8?"Easy":"Hard");
}
$("classSelect").addEventListener("change",updateLevel);
updateLevel();

function stopTimer(){
  if(timerHandle){clearInterval(timerHandle);timerHandle=null;}
}
function formatTime(seconds){
  const m=String(Math.floor(seconds/60)).padStart(2,"0");
  const s=String(seconds%60).padStart(2,"0");
  return m+":"+s;
}
function startTimer(){
  startedAt=Date.now()-elapsed*1000;
  stopTimer();
  timerHandle=setInterval(()=>{
    elapsed=Math.floor((Date.now()-startedAt)/1000);
    $("timer").textContent=formatTime(elapsed);
  },1000);
}
function showOnly(section){
  ["setup","test","result"].forEach(id=>$(id).classList.toggle("hidden",id!==section));
}
function startTest(){
  const cls=$("classSelect").value, subject=$("subjectSelect").value;
  questions=allQuestions[cls][subject];
  answers=Array(questions.length).fill(null);
  current=0;elapsed=0;
  $("testName").textContent=`Class ${cls} · ${subject} · ${Number(cls)<=8?"Easy":"Hard"}`;
  $("timer").textContent="00:00";
  showOnly("test");
  startTimer();
  renderQuestion();
}
function renderQuestion(){
  const q=questions[current];
  $("count").textContent=`Question ${current+1} of ${questions.length}`;
  $("question").textContent=q.question;
  $("progress").style.width=((current+1)/questions.length*100)+"%";
  $("options").innerHTML="";
  q.options.forEach((option,index)=>{
    const label=document.createElement("label");
    label.className="option";
    const input=document.createElement("input");
    input.type="radio";input.name="answer";input.value=index;
    input.checked=answers[current]===index;
    input.addEventListener("change",()=>{answers[current]=index;renderQuestion();});
    const text=document.createElement("span");
    text.textContent=String.fromCharCode(65+index)+". "+option;
    label.append(input,text);
    $("options").append(label);
  });
  $("prev").disabled=current===0;
  $("next").classList.toggle("hidden",current===questions.length-1);
  $("submit").classList.toggle("hidden",current!==questions.length-1);
}
function finishTest(){
  stopTimer();
  const cls=$("classSelect").value,subject=$("subjectSelect").value;
  let correct=0;
  questions.forEach((q,i)=>{if(answers[i]===q.answer)correct++;});
  const wrong=questions.length-correct,percent=Math.round(correct/questions.length*100);
  $("resultName").textContent=`Class ${cls} · ${subject} · Time: ${formatTime(elapsed)}`;
  $("score").textContent=`${correct} / ${questions.length}`;
  $("correct").textContent=correct;$("incorrect").textContent=wrong;
  $("percent").textContent=percent+"%";
  $("message").textContent=percent>=80?"Excellent work! Keep it up.":percent>=50?"Good effort! Review the answers and practise again.":"Keep practising. Learn from the review and try again.";
  $("review").innerHTML="";
  questions.forEach((q,i)=>{
    const div=document.createElement("div");div.className="review";
    const title=document.createElement("p");title.textContent=`${i+1}. ${q.question}`;
    const your=document.createElement("p");
    const chosen=answers[i]===null?"Not answered":q.options[answers[i]];
    your.textContent="Your answer: "+chosen;
    your.className=answers[i]===q.answer?"correct":"wrong";
    const correctAnswer=document.createElement("p");
    correctAnswer.className="correct";
    correctAnswer.textContent="Correct answer: "+q.options[q.answer];
    div.append(title,your,correctAnswer);$("review").append(div);
  });
  showOnly("result");
}
$("start").addEventListener("click",startTest);
$("prev").addEventListener("click",()=>{if(current>0){current--;renderQuestion();}});
$("next").addEventListener("click",()=>{if(current<questions.length-1){current++;renderQuestion();}});
$("submit").addEventListener("click",()=>{
  const unanswered=answers.filter(a=>a===null).length;
  if(unanswered&&!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`))return;
  finishTest();
});
$("exit").addEventListener("click",()=>{
  if(confirm("Exit this test? Your current answers will be lost.")){stopTimer();showOnly("setup");}
});
$("retry").addEventListener("click",startTest);
$("change").addEventListener("click",()=>showOnly("setup"));
</script>
</body>
</html>
